    <!--
      The link gets shared in chat apps and now sits in an Instagram bio, so
      the preview card is most readers' first sight of the site.
      The title is the site's name as the site prints it, so the description
      carries the whole job of telling a recipient who cannot read those six
      characters what they have been sent; without it the card is a bare URL.
      Third person on purpose: this is a card about the site, unlike the page
      copy, which is Petr's own voice.
    -->

      name="description"
      content="Petr is walking across Kyushu to 88 of its hot springs. A live map of the route so far, the onsens he has reached, and his notes from each one."
