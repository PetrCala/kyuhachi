name: Deploy Firestore and Storage rules

# Keep the deployed security rules and indexes in lockstep with the repo.
# Without this, edits to firebase/firestore.rules merge to master but only take
# effect in production once someone remembers to run `firebase deploy` by hand:
# exactly how the route_plans -> routes rename shipped to the repo but not to
# Firebase, breaking route imports with permission-denied in production.
#
# firebase/storage.rules is deployed here for the same reason. It was previously
# left out, so every storage.rules edit was an undeployed no-op until someone
# noticed.
#
# Required setup (in the kyuhachi-fddcc Google Cloud project):
#   - Secret FIREBASE_SERVICE_ACCOUNT: the full JSON key of a service account,
#     stored under Settings -> Secrets and variables -> Actions.
#   - That service account needs all SIX of these roles:
#       * roles/firebaserules.admin            (deploy firestore:rules + storage)
#       * roles/datastore.indexAdmin           (deploy firestore:indexes)
#       * roles/serviceusage.serviceUsageConsumer
#           The Firebase CLI calls the Service Usage API to verify
#           firestore.googleapis.com is enabled before deploying; without this
#           role the deploy fails with a 403 on serviceusage.googleapis.com.
#       * roles/firebasestorage.admin          (the Storage step; it holds
#           `firebasestorage.defaultBucket.get`, which firebaserules.admin lacks)
#       * roles/firebase.viewer                (also the Storage step, see below)
#       * roles/firebasedatabase.admin         (deploy database rules)
#     (The account also holds roles/firebasehosting.admin, for the separate
#     website-deploy workflow, not for anything here.)
#
#   The Storage step used to fail even with firebasestorage.admin, and the fix
#   was roles/firebase.viewer, granted 2026-08-17. Worth knowing, because the
#   error message sends you the wrong way: `firebase deploy --only storage` calls
#   GET v1alpha/projects/{project}/defaultBucket to resolve the bucket, and
#   firebase-tools turns a 404 from it into "Firebase Storage has not been set up
#   on project". Storage was always set up. The service account simply could not
#   read the project's Firebase metadata, so that lookup 404'd for it while
#   returning 200 with kyuhachi-fddcc.firebasestorage.app under a user account.
#   Confirmed by granting the role and re-running this workflow: all three deploy
#   steps passed, having previously failed at Storage.
#
#   Note that the deploy steps run in one job with no continue-on-error, so a
#   failure partway through skips every later step (a failing Storage step used
#   to skip the Database one). Firestore is deployed first for that reason.
#
#     Do NOT "fix" this by switching firebase.json's `storage` to the array form
#     with an explicit bucket. It does skip the failing lookup (see
#     lib/deploy/storage/prepare.js), but the array form requires a `target` per
#     entry and the Storage emulator resolves targets per PROJECT ID, so the
#     rules tests, which run as kyuhachi-test, would need contrived targets, and
#     under a demo-* project the emulator silently falls back to OPEN rules and
#     the tests stop testing anything. That was tried and reverted.
on:
  push:
    branches: [master]
    paths:
      - firebase/firestore.rules
      - firebase/firestore.indexes.json
      - firebase/storage.rules
      - firebase/database.rules.json
  # Manual trigger: lets a maintainer re-deploy the current rules/indexes on
  # demand (e.g. to verify the service-account auth, or to push state that has
  # drifted) without having to touch a rules file.
  workflow_dispatch:

# Serialize deploys so two pushes in quick succession can't race each other to
# Firebase. cancel-in-progress is false so an in-flight deploy is never killed.
concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  rules-test:
    name: Firestore and Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install test dependencies
        run: npm ci
        working-directory: firebase

      # All three emulators: firebase/test covers firestore.rules,
      # storage.rules and database.rules.json.
      - name: Run rules tests
        run: firebase emulators:exec --only firestore,storage,database --project kyuhachi-test "npm test"
        working-directory: firebase

  deploy:
    name: Deploy rules + indexes
    needs: rules-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Write the service-account JSON to a file and point
      # GOOGLE_APPLICATION_CREDENTIALS at it. The secret is passed via env (not
      # interpolated into the command) so the JSON never lands in the shell
      # history or logs. This replaces the deprecated FIREBASE_TOKEN auth.
      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      # Runs from the repo root so firebase.json (which maps the rules/indexes to
      # firebase/firestore.*) is picked up.
      #
      # Firestore and Storage deploy as SEPARATE steps, Firestore first, and that
      # ordering is load-bearing. `firebase deploy` resolves every requested
      # target's config before deploying any of them, so a single combined
      # invocation that cannot reach the Storage bucket aborts before the
      # Firestore rules ever go out. That is exactly what happened when storage
      # was first added here: a 403 on the bucket took the Firestore deploy down
      # with it. Split this way, a Storage-side problem still fails the job
      # loudly but can never block the Firestore rules.
      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:rules,firestore:indexes --project kyuhachi-fddcc --non-interactive

      - name: Deploy Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only storage --project kyuhachi-fddcc --non-interactive

      # Realtime Database rules (the journey website's presence counter,
      # firebase/database.rules.json). Separate step for the same reason as
      # Storage: it keeps a Database-side failure off the Firestore rules, which
      # deploy first. Its two preconditions are both done as of 2026-08-17: the
      # default instance (kyuhachi-fddcc-default-rtdb, us-central1) exists, and
      # the service account has roles/firebasedatabase.admin. If either is ever
      # lost this step fails loudly; deploy by hand with
      #   firebase deploy --only database --project kyuhachi-fddcc
      - name: Deploy Realtime Database rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only database --project kyuhachi-fddcc --non-interactive
