name: CI

on:
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shared
        run: npx tsc --noEmit
        working-directory: shared

      - name: Typecheck app
        run: npx tsc --noEmit
        working-directory: app

  functions:
    name: Functions typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Functions is outside the npm workspace (its own lockfile), so it needs
      # its own install; deploys build from here too.
      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Typecheck
        run: npm run typecheck
        working-directory: functions

      - name: Unit tests
        run: npm test
        working-directory: functions

  rules-test:
    name: Firestore and Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install test dependencies
        run: npm ci
        working-directory: firebase

      # All three emulators: firebase/test covers firestore.rules,
      # storage.rules and database.rules.json, and each suite errors out if
      # its emulator is not running.
      - name: Run rules tests
        run: firebase emulators:exec --only firestore,storage,database --project kyuhachi-test "npm test"
        working-directory: firebase

  website:
    name: Website typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Typecheck and build
        run: npm run build
        working-directory: website
