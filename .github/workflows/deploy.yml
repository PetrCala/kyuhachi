name: Deploy

# Self-owned iOS pipeline: build on a GitHub macOS runner with fastlane and
# upload to TestFlight, instead of EAS's cloud build (whose free-tier monthly
# quota kept blocking deploys). kyuhachi is a public repo, so runner minutes are
# free. The app stays Expo-MANAGED: `app/ios` is gitignored and regenerated by
# `expo prebuild` on every run — native code is never committed. Signing creds
# arrive as base64 GitHub secrets decoded to files at build time (the same
# pattern already used for GoogleService-Info). See app/fastlane/Fastfile.
#
# eas.json / EXPO_TOKEN are intentionally kept as a fallback (and for
# `eas credentials` cert export / dev-client builds).
#
# The marketing version is bumped by the `version` job below before the build,
# so every deploy ships a version the repo agreed on rather than only a new
# TestFlight build number. See docs/versioning.md.

on:
  push:
    branches: [master]
  # Manual trigger: lets a maintainer run a verification build from any branch
  # (e.g. before merging this pipeline) without pushing to master. Only runs
  # from master bump the version; from any other branch this builds as-is.
  workflow_dispatch:
    inputs:
      version_level:
        description: Marketing version bump for this deploy
        required: false
        default: auto
        type: choice
        options: [auto, none, patch, minor, major]

permissions:
  # Push the release commit and its tag back to master.
  contents: write
  # Read the `version:*` labels off the PRs being released.
  pull-requests: read

# Serialize deploys. A new push waits for the running deploy to finish rather
# than racing it; while one runs, a burst of pushes collapses to a single
# queued follow-up. cancel-in-progress is false so an in-flight build/submit is
# never killed midway. This prevents two overlapping runs from each resolving
# "the latest build" to the same binary (the ITMS-90189 redundant-upload bug).
# It also keeps the version job's push to master from racing another deploy's.
concurrency:
  group: deploy-ios
  cancel-in-progress: false

jobs:
  # Resolve how far to bump CFBundleShortVersionString, apply it, and hand the
  # resulting commit to the build. The build number (CFBundleVersion) is NOT
  # decided here: fastlane still derives it from TestFlight at build time.
  version:
    name: Resolve marketing version
    runs-on: ubuntu-latest
    # Last of three guards against a release commit re-triggering this
    # workflow (see docs/versioning.md). Skipping here also skips the build,
    # which `needs` this job.
    if: github.actor != 'github-actions[bot]'
    outputs:
      # The commit the build must check out: the release commit when a bump
      # happened, otherwise the branch tip.
      sha: ${{ steps.apply.outputs.sha }}
      version: ${{ steps.apply.outputs.version }}
      level: ${{ steps.resolve.outputs.level }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release from the tip of the branch, not from github.sha: a run that
          # sat in the concurrency queue while another commit landed would
          # otherwise build a stale tree and push a non-fast-forward release
          # commit.
          ref: ${{ github.ref_name }}
          # Full history and tags: the release range starts at the last v* tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Everything since the last released tag, not just the head commit. A
      # push that resolves to `none` leaves no tag behind, so its files and its
      # PR labels roll forward into the next release instead of being lost.
      - name: Collect the release range
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            # No release has been tagged yet; look at the head commit alone.
            RANGE="HEAD~1..HEAD"
          fi
          echo "Release range: $RANGE" >> "$GITHUB_STEP_SUMMARY"

          {
            echo 'changed_files<<CHANGED_FILES_EOF'
            git diff --name-only "$RANGE"
            echo 'CHANGED_FILES_EOF'
          } >> "$GITHUB_OUTPUT"

          # Squash-merge subjects end in "(#123)", which is the only link back
          # to the PR that carries the version label.
          PR_NUMBERS=$(git log --pretty=%s "$RANGE" | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p' | sort -u)

          {
            echo 'pr_labels<<PR_LABELS_EOF'
            for pr in $PR_NUMBERS; do
              gh pr view "$pr" --json labels --jq '.labels[].name' 2>/dev/null || true
            done
            echo 'PR_LABELS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the bump level
        id: resolve
        env:
          DISPATCH_LEVEL: ${{ inputs.version_level }}
          PR_LABELS: ${{ steps.range.outputs.pr_labels }}
          CHANGED_FILES: ${{ steps.range.outputs.changed_files }}
        run: |
          set -eo pipefail
          node scripts/resolve-version-level.mjs > "$RUNNER_TEMP/level.txt"
          cat "$RUNNER_TEMP/level.txt" >> "$GITHUB_OUTPUT"
          sed 's/^/- /' "$RUNNER_TEMP/level.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the bump
        id: apply
        env:
          LEVEL: ${{ steps.resolve.outputs.level }}
          ON_MASTER: ${{ github.ref == 'refs/heads/master' }}
        run: |
          set -eo pipefail

          read_version() { node -p "require('./app/package.json').version"; }

          if [ "$ON_MASTER" != "true" ]; then
            echo "::notice::Not on master; building without a version bump."
            LEVEL=none
          fi

          if [ "$LEVEL" = "none" ]; then
            VERSION=$(read_version)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "No version bump; building $VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node scripts/version.mjs "$LEVEL"
          VERSION=$(read_version)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "::error::version.mjs reported a $LEVEL bump but changed nothing."
            exit 1
          fi

          # A GITHUB_TOKEN push does not trigger workflows, so this cannot loop;
          # [skip ci] states the intent and covers a future token change.
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag "v$VERSION"

          # Tag pushes only after the branch push succeeds, so a rejected push
          # cannot leave a tag pointing at a commit master never took.
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::error::Could not push v$VERSION; master moved while this run was queued. The follow-up deploy will pick these changes up."
            exit 1
          fi
          git push origin "v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Released **v$VERSION** ($LEVEL bump)." >> "$GITHUB_STEP_SUMMARY"

  build-and-submit:
    name: iOS Build + TestFlight (self-owned)
    needs: version
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Pin Xcode to a version present on the macos-26 image (mirrors the
      # Kiroku app). If the image's Xcode changes, update this path.
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      # `xcodebuild -showBuildSettings` is slow with many static pods; bump
      # fastlane's defaults so build_app doesn't time out reading settings.
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
    steps:
      # The release commit the version job just pushed (or the branch tip when
      # it decided not to bump). Checking out the default ref would build the
      # commit that triggered the run, which still carries the old version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Workspace install from the repo root (deps are hoisted; app/ has no
      # standalone node_modules). `expo prebuild` needs these.
      - name: Install dependencies
        run: npm ci

      # Ruby + bundler (fastlane, CocoaPods 1.16.2). Set up before prebuild so
      # `bundle exec pod install` is available; uses app/Gemfile + app/.ruby-version.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: app
          bundler-cache: true

      # Secret -> file. Value is passed via env (never interpolated into the
      # command) so it stays out of the logs. The plist must exist before
      # prebuild: app.config.js resolves "./GoogleService-Info.plist".
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is not set." >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > app/GoogleService-Info.plist

      - name: Write signing + App Store Connect credentials
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          ASC_API_KEY_JSON_BASE64: ${{ secrets.ASC_API_KEY_JSON_BASE64 }}
        run: |
          for var in IOS_DIST_CERT_P12_BASE64 ASC_API_KEY_JSON_BASE64; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is not set." >&2
              exit 1
            fi
          done
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist_cert.p12"
          printf '%s' "$ASC_API_KEY_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_api_key.json"

      # Regenerate the native iOS project. Runs plugins/withAllowNonModularIncludes,
      # which patches the Podfile — so pod install MUST come after this.
      # --no-install: deps are already installed at the root and pods run below.
      - name: Expo prebuild (iOS)
        working-directory: app
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: app
        run: bash scripts/pod-install.sh

      # The macos-26 image's Xcode ships without the iOS platform SDK, but the
      # archive's "Any iOS Device" destination needs it. Download it, retrying
      # since it intermittently fails on a cold runner.
      - name: Install iOS platform SDK
        run: |
          n=0
          until xcodebuild -downloadPlatform iOS; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::xcodebuild -downloadPlatform iOS failed after 3 attempts" >&2
              exit 1
            fi
            echo "downloadPlatform attempt $n failed; retrying in 30s..."
            sleep 30
          done

      - name: Build and upload to TestFlight
        working-directory: app
        timeout-minutes: 60
        env:
          ASC_API_KEY_PATH: ${{ runner.temp }}/asc_api_key.json
          IOS_DIST_CERT_P12_PATH: ${{ runner.temp }}/dist_cert.p12
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
        run: bundle exec fastlane ios beta
